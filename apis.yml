name: Zenprise
description: >-
  Zenprise was an enterprise Mobile Device Management (MDM) vendor founded in 2003 by
  Waheed Qureshi and Jayaram Bhat. It shipped Zenprise MobileManager, an on-premises MDM
  platform for device lifecycle management and mobile security, and Zencloud, a cloud-based
  MDM service launched in 2011, together supporting iOS, Android, BlackBerry, Windows Mobile,
  and Symbian devices across more than 1,000 global enterprise and government customers. In
  2010 Zenprise acquired French MDM vendor Sparus Software. Citrix announced its intent to
  acquire Zenprise in December 2012 and closed the deal in January 2013, folding the product
  into what became Citrix XenMobile. Zenprise no longer operates as an independent company and
  publishes no live developer, documentation, or API surface. Surfaced as a portfolio company
  of Mayfield and added to the API Evangelist network as a stub for enrichment.
